<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ff60"/>
      <stop offset="100%" stop-color="#c8ee00"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4ff1a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Subtle Cyber Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#08090d" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Top-Left Finder Eye -->
  <rect x="11" y="11" width="18" height="18" rx="4.5" fill="none" stroke="url(#voltGrad)" stroke-width="3" filter="url(#glow)"/>
  <rect x="15.5" y="15.5" width="9" height="9" rx="2" fill="url(#voltGrad)"/>

  <!-- Top-Right Finder Eye -->
  <rect x="35" y="11" width="18" height="18" rx="4.5" fill="none" stroke="url(#voltGrad)" stroke-width="3" filter="url(#glow)"/>
  <rect x="39.5" y="15.5" width="9" height="9" rx="2" fill="url(#voltGrad)"/>

  <!-- Bottom-Left Finder Eye -->
  <rect x="11" y="35" width="18" height="18" rx="4.5" fill="none" stroke="url(#voltGrad)" stroke-width="3" filter="url(#glow)"/>
  <rect x="15.5" y="39.5" width="9" height="9" rx="2" fill="url(#voltGrad)"/>

  <!-- Timing and Data Modules (QRFlex High-Octane Array) -->
  <rect x="35" y="35" width="7" height="7" rx="2" fill="url(#voltGrad)"/>
  <rect x="46" y="35" width="7" height="7" rx="2" fill="url(#voltGrad)"/>
  <rect x="35" y="46" width="7" height="7" rx="2" fill="url(#voltGrad)"/>
  
  <!-- High-Octane Beacon Data Bit (Matrix Cyan Accent) -->
  <rect x="46" y="46" width="7" height="7" rx="2" fill="#00e5ff" filter="url(#glow)"/>

  <!-- Center Micro-Bits -->
  <rect x="23" y="30" width="3.5" height="3.5" rx="1" fill="url(#voltGrad)" opacity="0.9"/>
  <rect x="30" y="23" width="3.5" height="3.5" rx="1" fill="url(#voltGrad)" opacity="0.9"/>
  <rect x="37.5" y="30" width="3.5" height="3.5" rx="1" fill="url(#voltGrad)" opacity="0.9"/>
  <rect x="30" y="37.5" width="3.5" height="3.5" rx="1" fill="url(#voltGrad)" opacity="0.9"/>
</svg>